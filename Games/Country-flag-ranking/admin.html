<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manual Entry — Admin</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #1a0526; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    padding: 20px;
  }
  .card {
    width: 100%; max-width: 380px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px; padding: 22px;
  }
  h1 { font-size: 18px; margin: 0 0 6px; }
  .hint { font-size: 12px; color: #86efac; margin-bottom: 18px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #e6dcef; margin-bottom: 14px; }
  input {
    display: block; width: 100%; margin-top: 6px;
    padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.25); color: #fff; font-size: 14px;
  }
  button {
    width: 100%; padding: 12px; border-radius: 10px; border: none; font-size: 15px; font-weight: 700;
    cursor: pointer; background: linear-gradient(135deg, #ff5da2, #ff8a00); color: #1a0526;
  }
  #status { font-size: 13px; min-height: 18px; margin-top: 12px; text-align: center; }
  #status.error { color: #ff8080; }
  #status.ok { color: #86efac; }
</style>
</head>
<body>
  <div class="card">
    <h1>✍️ Manual Entry</h1>

    <label>Viewer name (optional)
      <input id="name" type="text" placeholder="e.g. Priya" />
    </label>
    <label>Comment text
      <input id="text" type="text" placeholder="e.g. India or 'subscribed! Brazil'" autofocus />
    </label>
    <button id="submit">Add Comment (+1)</button>
    <p id="status"></p>
  </div>

  <script>
    const nameEl = document.getElementById('name');
    const textEl = document.getElementById('text');
    const statusEl = document.getElementById('status');

    async function submit() {
      const text = textEl.value.trim();
      if (!text) return;
      statusEl.className = ''; statusEl.textContent = 'Sending…';
      try {
        const res = await fetch('/api/manual', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, authorName: nameEl.value.trim() }),
        });
        const data = await res.json();
        if (data.ok) {
          statusEl.className = 'ok';
          statusEl.textContent = data.countryCode ? `Added! (${data.countryCode.toUpperCase()})` : 'Added!';
          textEl.value = '';
          textEl.focus();
        } else {
          statusEl.className = 'error';
          statusEl.textContent = data.error || 'Could not add that entry.';
        }
      } catch (e) {
        statusEl.className = 'error';
        statusEl.textContent = 'Could not reach the server.';
      }
    }

    document.getElementById('submit').addEventListener('click', submit);
    textEl.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  </script>
</body>
</html>
